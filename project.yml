name: LeoneraKeyboard
options:
  bundleIdPrefix: com.leonera
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    # Cambia estos identificadores si usas tu propio equipo de desarrollo en Xcode.
    # En GitHub Actions, al firmar Ad Hoc se usan com.<usuario>.<repositorio> (ver README).
    APP_BUNDLE_ID: com.leonera.keyboard
    EXTENSION_BUNDLE_ID: $(APP_BUNDLE_ID).extension
    APP_GROUP_ID: group.com.leonera.keyboard

targets:
  LeoneraKeyboard:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Leonera Keyboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSMicrophoneUsageDescription: Leonera Keyboard graba tu voz para dictar desde el teclado. El audio se envía a Groq para convertirlo en texto.
        # El micrófono sigue activo en segundo plano para grabar cuando lo pida el teclado.
        UIBackgroundModes:
          - audio
        # El teclado abre la app con leonerakeyboard://dictation para activar el micrófono.
        CFBundleURLTypes:
          - CFBundleURLName: com.leonera.keyboard
            CFBundleURLSchemes:
              - leonerakeyboard
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/LeoneraKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    dependencies:
      - target: LeoneraKeyboardExtension
    scheme:
      testTargets: []

  LeoneraKeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(EXTENSION_BUNDLE_ID)
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Leonera
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSMicrophoneUsageDescription: Leonera Keyboard graba tu voz para dictar. El audio se envía a Groq para convertirlo en texto.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: es-ES
            RequestsOpenAccess: true
    entitlements:
      path: KeyboardExtension/LeoneraKeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
