name: Build

# Se compila en cada commit enviado (push) a cualquier rama, no en los pull requests.
# - Rama main: se publica un release estable 0.x.0 (0.1.0, 0.2.0, …).
# - Otras ramas: se publica un pre-release con la etiqueta build-<número>-<commit>.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  # En main no se cancela nada: cada commit debe generar su release (y así no
  # se calculan dos versiones iguales a la vez).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Compilar y publicar
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versión y etiqueta
        id: version
        run: |
          git fetch --tags --force
          last=$(git tag -l '0.*.0' | grep -E '^0\.[0-9]+\.0$' | sort -t. -k2,2n | tail -n1)
          if [ -z "$last" ]; then
            minor=1
          else
            minor=$(( $(echo "$last" | cut -d. -f2) + 1 ))
          fi
          version="0.${minor}.0"
          short_sha="${GITHUB_SHA::7}"

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tag="$version"
            release=true
          else
            tag="build-${GITHUB_RUN_NUMBER}-${short_sha}"
            release=false
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "ipa=LeoneraKeyboard-${tag}-unsigned.ipa" >> "$GITHUB_OUTPUT"
          echo "Versión: $version · Etiqueta: $tag · Release estable: $release"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Compilar (iphoneos, sin firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project LeoneraKeyboard.xcodeproj \
            -scheme LeoneraKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=${{ steps.version.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      # Sin firma, los binarios no llevan entitlements y SideStore/AltStore no saben
      # que hace falta un App Group: no lo registran y la app y el teclado no comparten
      # ajustes. La firma ad-hoc (sin certificado) incluye el App Group para que la
      # herramienta con la que se instale lo registre al volver a firmar.
      - name: Firmar ad-hoc con el App Group
        run: |
          APP=build/Build/Products/Release-iphoneos/LeoneraKeyboard.app
          EXT="$APP/PlugIns/LeoneraKeyboardExtension.appex"
          GROUP=$(awk '/^[[:space:]]+APP_GROUP_ID:/ {print $2}' project.yml)
          test -n "$GROUP"
          mkdir -p signing
          cat > signing/entitlements.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.application-groups</key>
              <array>
                  <string>$GROUP</string>
              </array>
          </dict>
          </plist>
          EOF
          plutil -lint signing/entitlements.plist
          # Primero la extensión: la firma de la app incluye la de sus PlugIns.
          codesign --force --sign - --timestamp=none --entitlements signing/entitlements.plist "$EXT"
          codesign --force --sign - --timestamp=none --entitlements signing/entitlements.plist "$APP"
          for bundle in "$EXT" "$APP"; do
            codesign --verify --verbose "$bundle"
            codesign -d --entitlements - "$bundle" 2>&1 | tee /dev/stderr | grep -q "$GROUP"
          done

      - name: Empaquetar IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/LeoneraKeyboard.app
          test -d "$APP/PlugIns/LeoneraKeyboardExtension.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${{ steps.version.outputs.ipa }}" Payload

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LeoneraKeyboard-${{ steps.version.outputs.tag }}
          path: ${{ steps.version.outputs.ipa }}
          if-no-files-found: error

      - name: Publicar release (main)
        if: steps.version.outputs.release == 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.ipa }}" \
            --target "$GITHUB_SHA" \
            --title "Leonera Keyboard ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --latest

      - name: Publicar build (otras ramas)
        if: steps.version.outputs.release != 'true'
        run: |
          notes=$(printf 'Build automático de la rama `%s`.\n\nCommit: %s\n\n%s\n\nIPA sin firmar: hay que firmarlo para instalarlo.' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(git log -1 --pretty=%s)")
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.version.outputs.ipa }}" \
            --target "$GITHUB_SHA" \
            --title "Build ${{ github.run_number }} (${GITHUB_REF_NAME}, ${GITHUB_SHA::7})" \
            --notes "$notes" \
            --prerelease
