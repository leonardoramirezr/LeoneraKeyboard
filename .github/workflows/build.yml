name: Build

# Se compila en cada commit enviado (push) a cualquier rama, no en los pull requests.
on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar app y teclado
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Versión de Xcode
        run: xcodebuild -version

      - name: Compilar (iphoneos, sin firma)
        run: |
          set -o pipefail
          xcodebuild \
            -project LeoneraKeyboard.xcodeproj \
            -scheme LeoneraKeyboard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Empaquetar IPA sin firmar
        run: |
          APP=build/Build/Products/Release-iphoneos/LeoneraKeyboard.app
          test -d "$APP/PlugIns/LeoneraKeyboardExtension.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry LeoneraKeyboard-unsigned.ipa Payload

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: LeoneraKeyboard-${{ github.sha }}
          path: LeoneraKeyboard-unsigned.ipa
          if-no-files-found: error
